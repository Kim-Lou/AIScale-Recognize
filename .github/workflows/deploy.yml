# GitHub Actions CI/CD工作流配置
name: Deploy to Production

on:
  push:
    branches: [ production ]
  pull_request:
    branches: [ production ]
    types: [ closed ]

jobs:
  # 构建和测试作业
  build-and-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run backend tests
      run: npm run test:backend
    
    - name: Build frontend
      run: npm run build:prod
    
  # 部署作业
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/production'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to production server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.ALIYUN_HOST }}
        username: ${{ secrets.ALIYUN_USER }}
        key: ${{ secrets.ALIYUN_KEY }}
        port: ${{ secrets.ALIYUN_PORT || '22' }}
        script: |
          # 进入项目目录
          cd /opt/scalesense-ai
          
          # 更新代码
          git pull origin production
          
          # 安装依赖
          npm ci --only=production
          
          # 构建前端
          npm run build:prod
          
          # 复制生产环境配置
          cp .env.production .env
          
          # 重启服务
          pm2 restart scalesense-ai || pm2 start server/index.js --name scalesense-ai
          
          # 健康检查
          sleep 3
          curl -s -o /dev/null -w "%{http_code}" http://localhost:5001/api/health || exit 1
    
  # 部署通知作业
  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    
    steps:
    - name: Send deployment status notification
      run: |
        echo "部署状态: ${{ needs.deploy.result }}"
        echo "部署完成于: $(date)"