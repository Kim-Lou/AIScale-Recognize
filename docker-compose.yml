version: '3.8'

services:
  scalesense:
    build: .
    ports:
      - "5173:5173"  # 前端端口
      - "5000:5000"  # 后端端口
    volumes:
      - ./server/data:/app/server/data
      - ./server/uploads:/app/server/uploads
    environment:
      - NODE_ENV=development
      - PORT=5000
      - VITE_PORT=5173
    restart: unless-stopped